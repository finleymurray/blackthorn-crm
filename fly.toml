# Fly.io config for an always-on London test. See docs/always-on-hosting.md.
app = "blackthorn-crm"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_SUPABASE_URL = "https://uaclhscpseivkuzajuly.supabase.co"
  NEXT_PUBLIC_APP_URL = "https://blackthorn-crm.fly.dev"
  # Publishable key: safe in the browser, access is enforced by row level security.
  NEXT_PUBLIC_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVhY2xoc2Nwc2Vpdmt1emFqdWx5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0MTIwNzYsImV4cCI6MjA4NTk4ODA3Nn0.kBcHtnR-oY8ZUq6S5xk6M0F_iAw35ayosq6EOwE1C78"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: never stop the machine, so there is no cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
