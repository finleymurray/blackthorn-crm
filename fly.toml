# Fly.io config for an always-on London test. See docs/always-on-hosting.md.
app = "blackthorn-crm"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[build.args]
  NEXT_PUBLIC_SUPABASE_URL = "https://uaclhscpseivkuzajuly.supabase.co"
  NEXT_PUBLIC_APP_URL = "https://blackthorn-crm.fly.dev"
  # NEXT_PUBLIC_SUPABASE_ANON_KEY is passed with --build-arg on deploy.

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: never stop the machine, so there is no cold start.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
